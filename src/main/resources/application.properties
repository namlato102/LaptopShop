spring.application.name=LaptopShop
spring.config.import=optional:file:.env[.properties]
#https://spring.io/guides/gs/accessing-data-mysql
#config database
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
#https://docs.spring.io/spring-boot/appendix/application-properties/index.html#appendix.application-properties.security
#config spring security
spring.security.user.name=${USER_NAME}
spring.security.user.password=${USER_PASSWORD}

